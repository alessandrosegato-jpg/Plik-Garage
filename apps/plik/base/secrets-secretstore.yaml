apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc:8200
      path: REPLACED-BY-OVERLAY
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: REPLACED-BY-OVERLAY
          serviceAccountRef:
            name: vault-reader
            audiences:
              - vault