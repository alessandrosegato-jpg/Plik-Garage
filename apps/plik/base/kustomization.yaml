apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - policies-quota.yaml
  - policies-limitrange.yaml
  - policies-networkpolicy.yaml
  - secrets-serviceaccount.yaml
  - secrets-secretstore.yaml
  - secrets-externalsecrets.yaml
  - garage-rbac.yaml
  - garage-service.yaml
  - garage-statefulset.yaml
  - garage-db.yaml
configMapGenerator:
  # Lo script del job diventa un ConfigMap garage-bootstrap-script-<hash>
  - name: garage-bootstrap-script
    files:
      - garage-bootstrap.py
