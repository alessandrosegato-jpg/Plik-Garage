apiVersion: v1
kind: LimitRange
metadata:
  name: plik-limits
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  limits:
    - type: Container
      defaultRequest:      # requests assegnate se mancano
        cpu: 50m
        memory: 64Mi
      default:             # limits assegnati se mancano
        cpu: 250m
        memory: 256Mi
      max:                 # nessun container può chiedere di più
        cpu: "1"
        memory: 1Gi
    - type: PersistentVolumeClaim
      max:
        storage: 20Gi      # nessuna singola PVC più grande di così