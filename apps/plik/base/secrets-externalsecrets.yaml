---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-plik-key
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: garage-plik-key
  dataFrom:
    - extract:
        key: s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plik-backends
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: plik-backends
    template:
      data:
        PLIKD_METADATA_BACKEND_CONFIG: '{"Driver":"postgres","ConnectionString":"postgres://{{ .db_username }}:{{ .db_password }}@plik-db-pooler-rw:5432/plik?sslmode=require"}'
        PLIKD_DATA_BACKEND_CONFIG: '{"AccessKeyID":"{{ .s3_access_key_id }}","SecretAccessKey":"{{ .s3_secret_access_key }}"}'
  data:
    - secretKey: db_username
      remoteRef:
        key: db
        property: username
    - secretKey: db_password
      remoteRef:
        key: db
        property: password
    - secretKey: s3_access_key_id
      remoteRef:
        key: s3
        property: access_key_id
    - secretKey: s3_secret_access_key
      remoteRef:
        key: s3
        property: secret_access_key