apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plik-db-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: plik-db-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: db
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
