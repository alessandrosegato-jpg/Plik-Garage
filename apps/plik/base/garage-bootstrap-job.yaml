# Job che configura Garage: layout, chiave S3 di Plik, bucket "plik" e permessi.
# La logica sta in garage-bootstrap.py (ConfigMap generato dalla kustomization).
# È idempotente: si può rieseguire quante volte si vuole.
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bootstrap
  labels:
    app.kubernetes.io/name: garage-bootstrap
    app.kubernetes.io/part-of: plik
  annotations:
    # Argo CD lo lancia DOPO ogni sync riuscito, cancellando prima quello vecchio:
    # così a ogni sync il bootstrap viene ripetuto (ed è innocuo farlo).
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3               # al massimo 3 nuovi tentativi se lo script fallisce
  activeDeadlineSeconds: 900    # oltre 15 minuti il job viene fermato
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-bootstrap
        app.kubernetes.io/part-of: plik
    spec:
      serviceAccountName: garage-bootstrap
      automountServiceAccountToken: false
      restartPolicy: Never      # ogni tentativo è un pod nuovo: i log restano consultabili
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          # UBI 9 con Python 3.12 di Red Hat. Da bloccare per digest:
          #   skopeo inspect docker://registry.access.redhat.com/ubi9/python-312:latest | jq -r .Digest
          image: registry.access.redhat.com/ubi9/python-312:latest
          command: ["python3", "/scripts/garage-bootstrap.py"]
          env:
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: garage, key: admin-token}
            - name: PLIK_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: s3, key: access-key-id}
            - name: PLIK_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: s3, key: secret-access-key}
            - name: GARAGE_REPLICAS         # deve coincidere con le repliche del StatefulSet
              value: "1"
            - name: GARAGE_CAPACITY_BYTES   # spazio offerto da ogni nodo (PVC data da 10Gi)
              value: "10000000000"
            - name: GARAGE_ZONE
              value: dc1
            - name: GARAGE_BUCKET
              value: plik
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: scripts
          configMap:
            name: garage-bootstrap-script
