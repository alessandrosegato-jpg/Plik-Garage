apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plik-dev
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"        # dopo operators(1), platform(2), vault(3), ci(4)
spec:
  project: default
  source:
    repoURL: https://github.com/alessandrosegato-jpg/Plik-Garage.git
    targetRevision: develop                   # dev segue develop
    path: apps/plik/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: plik-dev                       # uguale al namespace: del kustomization
  syncPolicy:
    automated:                                # sync automatica
      prune: true                             # file tolto da Git -> risorsa cancellata
      selfHeal: true                          # modifica a mano sul cluster -> riallineata
    syncOptions:
      - SkipDryRunOnMissingResource=true      # CRD degli operatori (Cluster, ExternalSecret...)
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m