apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plik-prod
resources:
  - namespace.yaml
  - ../base
patches:
  - path: patch-quota.yaml
  - path: patch-secretstore.yaml
helmGlobals:
  chartHome: ../charts
helmCharts:
  - name: plik
    releaseName: plik
    namespace: plik-prod
    valuesFile: values-plik.yaml
