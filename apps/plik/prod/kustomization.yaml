apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plik-prod
resources:
  - namespace.yaml
  - ../base
  - backup-pg-externalsecret.yaml
  - backup-pg-objectstore.yaml
  - backup-pg-scheduledbackup.yaml
patches:
  - path: patch-quota.yaml
  - path: patch-secretstore.yaml
  - path: patch-postgres.yaml
  - path: patch-pooler.yaml
  - path: patch-postgres-backup.yaml
  - target:
      labelSelector: app.kubernetes.io/instance=plik
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: plik
        annotations:
          argocd.argoproj.io/sync-wave: "2"
helmGlobals:
  chartHome: ../charts
helmCharts:
  - name: plik
    releaseName: plik
    namespace: plik-prod
    valuesFile: values-plik.yaml
images:
  - name: rootgg/plik
    newName: docker.io/rootgg/plik
    digest: sha256:114ed0bd4339032af50aa578091ead8b9ecb25290b38775f7fb4948c376b905b
configMapGenerator:
  - name: garage-config
    files:
      - garage.toml