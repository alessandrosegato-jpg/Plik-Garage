apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  replicas: 3
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: lvms-vg1
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: lvms-vg1
        resources:
          requests:
            storage: 7Gi