# Credenziali dello storage S3 dei backup (plik-prod/backup in Vault):
# endpoint, region, access_key_id, secret_access_key. Le usa il plugin Barman
# (ObjectStore plik-backup) e in futuro il CronJob rclone del task 2.7.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: backup-s3
  dataFrom:
    - extract:
        key: backup
