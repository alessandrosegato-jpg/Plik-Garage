# Base backup completo ogni notte. Con i WAL archiviati in continuo permette di
# ripristinare il database a qualunque istante (point-in-time recovery, task 2.8).
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: plik-db-daily
  annotations:
    argocd.argoproj.io/sync-wave: "1"     # dopo il Cluster (0)
spec:
  # Formato cron a 6 campi (con i secondi), orario UTC: 02:00 UTC = 03:00 in Italia d'inverno.
  schedule: "0 0 2 * * *"
  immediate: true                          # fa subito il primo backup, senza aspettare la notte
  backupOwnerReference: self
  cluster:
    name: plik-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
