apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plik-db
spec:
  instances: 3
  postgresql:
    synchronous:          # almeno una replica sincrona
      method: any
      number: 1
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: plik-db-pooler-rw
spec:
  instances: 2