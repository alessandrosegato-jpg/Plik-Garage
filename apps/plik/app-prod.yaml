apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plik-prod
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"        # dopo operators(1), platform(2), vault(3), ci(4)
spec:
  project: default
  source:
    repoURL: https://github.com/alessandrosegato-jpg/Plik-Garage.git
    targetRevision: main                
    path: apps/plik/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: plik-prod                       # uguale al namespace: del kustomization
  syncPolicy:
    syncOptions:
      - SkipDryRunOnMissingResource=true      # CRD degli operatori (Cluster, ExternalSecret...)
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m