{{- if .Values.serviceMonitor.enabled }}
{{- if not .Values.plikd.MetricsPort }}
{{- fail "serviceMonitor.enabled richiede plikd.MetricsPort diverso da 0: senza, Plik non espone /metrics" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "plik.fullname" . }}
  labels:
    {{- include "plik.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "plik.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
