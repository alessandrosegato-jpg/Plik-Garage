apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: "0.34.1"
      helm:
        releaseName: vault
        valueFiles:
          - $values/apps/vault/values.yaml
    - repoURL: https://github.com/alessandrosegato-jpg/Plik-Garage.git
      targetRevision: develop
      ref: values
      path: apps/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  ignoreDifferences:
    - group: route.openshift.io
      kind: Route
      name: vault
      namespace: vault
      jsonPointers:
        - /spec/host
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
