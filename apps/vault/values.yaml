global:
  openshift: true
  tlsDisable: true
injector:
  enabled: false
server:
  standalone:
    enabled: false
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault
                app.kubernetes.io/instance: vault
                component: server
            topologyKey: kubernetes.io/hostname
  dataStorage:
    enabled: true
    storageClass: lvms-vg1
    size: 10Gi
  authDelegator:
    enabled: true
  ha:
    enabled: true
    replicas: 3
    disruptionBudget:
      enabled: true
      maxUnavailable: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true
        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable     = 1
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
