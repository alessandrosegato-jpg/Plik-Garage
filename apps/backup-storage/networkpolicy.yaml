# Default deny in ingresso: entra solo chi serve.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-garage
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  policyTypes: [Ingress]
  ingress:
    # API S3: solo i pod PostgreSQL di plik-prod (sidecar del plugin Barman).
    # Il CronJob rclone del task 2.7 andrà aggiunto qui.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: plik-prod
          podSelector:
            matchLabels:
              cnpg.io/cluster: plik-db
      ports:
        - port: 3900
    # RPC tra nodi Garage
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage
      ports:
        - port: 3901
    # Admin API: solo il job di bootstrap
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage-bootstrap
      ports:
        - port: 3903
