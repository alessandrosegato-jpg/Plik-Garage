# Segreti del Garage di backup, da Vault (mount plik-prod, perché i backup sono di prod).
# Ruolo dedicato eso-backup-storage: legge SOLO plik-prod/backup e plik-prod/backup-garage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc:8200
      path: plik-prod
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-backup-storage
          serviceAccountRef:
            name: vault-reader
            audiences:
              - vault
---
# rpc_secret, admin_token, metrics_token di QUESTO Garage (diversi da quelli di Plik)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: garage-secrets
  dataFrom:
    - extract:
        key: backup-garage
---
# La chiave S3 che usa il plugin Barman (plik-prod/backup): il job la importa in Garage.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-plik-key
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: garage-plik-key
  dataFrom:
    - extract:
        key: backup
