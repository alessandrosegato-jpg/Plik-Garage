apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system 
resources:
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.16.0/manifest.yaml
patches:
  # OpenShift (SCC restricted-v2) assegna un UID casuale al namespace:
  # togliamo l'UID fisso del manifest ufficiale, senza usare anyuid.
  - target:
      kind: Deployment
      name: barman-cloud
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/containers/0/securityContext/runAsGroup