# CloudNativePG installato in openshift-operators, come gli altri operatori globali
# (Pipelines). Qui c'è già l'OperatorGroup globale "global-operators" (AllNamespaces):
# NON va creato un altro OperatorGroup, altrimenti OLM si ferma con MultipleOperatorGroupsFound.
# Il plugin Barman deve stare nello stesso namespace (apps/platform/barman-cloud-plugin).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cloudnative-pg
  namespace: openshift-operators
spec:
  name: cloudnative-pg                  # nome del pacchetto
  source: certified-operators           # catalogo (diverso da ESO!)
  sourceNamespace: openshift-marketplace
  channel: stable-v1
  installPlanApproval: Manual
